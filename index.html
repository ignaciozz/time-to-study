<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time to Study!</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">

        <script src="script.js"></script>

        <h1>Time to Study!</h1>

        <section class="player">
            <h2>Nível <span id="level">1</span></h2>

            <div class="xp-bar">
                <div class="xp-progress"></div>
            </div>

            <p>
                <span id="xp">0</span> / 100
            </p>
        </section>

        <section class="timer">
            <h2 id="time">25:00</h2>
        </section>

        <section class="controls">
            <button id="start-btn">
                Iniciar
            </button>

            <button id="pause-btn">
                Pausar
            </button>

            <button id="reset-btn">
                Resetar
            </button>
        </section>
    </main>

</body>
</html>
